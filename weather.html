<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>天气 · 言一</title>

<script>
(function(){
  document.documentElement.classList.add('js');
  try{
    var t = localStorage.getItem('theme');
    if(!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if(t) document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* =========================================================
   天气页
   ========================================================= */
.wv-page{
  max-width:820px;
  margin:0 auto;
  padding:0 var(--gutter) 44px;
}

.wv-hero{
  position:relative;
  display:flex;
  align-items:center;
  gap:20px;
  padding:26px 26px;
  margin-bottom:16px;
  border-radius:var(--r-xl);
  border:1px solid var(--line);
  background:linear-gradient(140deg,
    color-mix(in srgb, var(--accent) 16%, transparent),
    var(--glass) 62%);
  -webkit-backdrop-filter:var(--blur-strong);
  backdrop-filter:var(--blur-strong);
  box-shadow:var(--sh-2), inset 0 1px 0 var(--sheen);
  overflow:hidden;
}
.wv-hero::after{
  content:"";
  position:absolute;
  right:-30px;top:-40px;
  width:200px;height:200px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 40%, color-mix(in srgb, var(--purple) 26%, transparent), transparent 68%);
  pointer-events:none;
}
.wv-icon{
  font-size:54px;
  line-height:1;
  flex-shrink:0;
  filter:drop-shadow(0 10px 18px rgba(15,23,42,.22));
  animation:popIn .6s var(--spring-soft) backwards;
}
.wv-temp{
  font-family:var(--serif);
  font-size:clamp(40px,9vw,56px);
  font-weight:600;
  line-height:1;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.wv-desc{font-size:15px;color:var(--text-2);margin:7px 0 0}
.wv-place{
  margin-left:auto;
  text-align:right;
  font-size:12.5px;
  color:var(--text-2);
  position:relative;
}
.wv-place b{
  display:block;
  font-size:17px;
  color:var(--text);
  font-weight:600;
  letter-spacing:-.01em;
  margin-bottom:4px;
}

.wv-facts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:22px;
}
.fact{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:14px 8px;
  border:1px solid var(--line);
  border-radius:var(--r-l);
  background:var(--glass-thin);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--sheen);
  transition:transform var(--t) var(--spring-soft);
  animation:popIn .48s var(--spring-soft) backwards;
}
@media (hover:hover){.fact:hover{transform:translateY(-2px)}}
.fact b{font-size:16.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fact span{font-size:11.5px;color:var(--text-3)}

.wv-sec{margin-bottom:24px}
.wv-sec-t{
  display:flex;
  align-items:center;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-3);
  margin:0 0 11px;
}

/* 逐时 */
.wv-hourly{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 2px 12px;
  scroll-snap-type:x proximity;
  overscroll-behavior-x:contain;
}
.hr{
  flex:0 0 auto;
  width:64px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  padding:12px 4px;
  border:1px solid var(--line);
  border-radius:var(--r-m);
  background:var(--glass-thin);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--sheen);
  scroll-snap-align:start;
  font-variant-numeric:tabular-nums;
  transition:transform var(--t) var(--spring-soft),background var(--t-fast);
  animation:riseIn .44s var(--ease) backwards;
}
@media (hover:hover){.hr:hover{transform:translateY(-3px)}}
.hr.is-now{
  border-color:color-mix(in srgb, var(--accent) 45%, transparent);
  background:color-mix(in srgb, var(--accent) 13%, transparent);
}
.hr-h{font-size:11px;color:var(--text-3)}
.hr.is-now .hr-h{color:var(--accent);font-weight:600}
.hr-i{font-size:18px;line-height:1}
.hr-t{font-size:14px;font-weight:600}
.hr-p{font-size:10.5px;color:var(--accent);min-height:14px}

/* 7 天 */
.wv-daily{
  border:1px solid var(--line);
  border-radius:var(--r-l);
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  box-shadow:var(--sh-1), inset 0 1px 0 var(--sheen);
  overflow:hidden;
}
.dy{
  display:grid;
  grid-template-columns:56px 32px 42px 1fr 42px 44px;
  align-items:center;
  gap:8px;
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;
  transition:background var(--t-fast);
  animation:riseIn .46s var(--ease) backwards;
}
@media (hover:hover){.dy:hover{background:var(--fill)}}
.dy:last-child{border-bottom:0}
.dy-l{font-size:13px;color:var(--text-2)}
.dy-i{font-size:17px;line-height:1;text-align:center}
.dy-lo,.dy-hi{font-size:13.5px;text-align:center}
.dy-hi{font-weight:600}
.dy-bar{
  position:relative;
  height:5px;
  border-radius:5px;
  background:var(--fill-2);
  overflow:hidden;
}
.dy-bar i{
  position:absolute;top:0;bottom:0;
  border-radius:5px;
  background:linear-gradient(90deg,var(--teal),var(--accent));
  transform-origin:0 50%;
  animation:barIn .7s var(--ease) backwards;
}
@keyframes barIn{from{transform:scaleX(.1);opacity:.4}to{transform:scaleX(1);opacity:1}}
.dy-p{font-size:11.5px;color:var(--accent);text-align:right}

/* 地区切换 */
.wv-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.wv-search{
  width:100%;
  height:44px;
  padding:0 16px;
  border:1px solid var(--line);
  border-radius:var(--r-m);
  background:var(--glass-thin);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  font-size:14.5px;
  color:var(--text);
  outline:none;
  transition:border-color var(--t-fast),box-shadow var(--t-fast),background var(--t-fast);
}
.wv-search::placeholder{color:var(--text-3)}
.wv-search:focus{
  border-color:color-mix(in srgb, var(--accent) 60%, transparent);
  background:var(--surface);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
}
.wv-results{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.wv-result{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:12px 16px;
  border:1px solid var(--line);
  border-radius:var(--r-m);
  background:var(--glass-thin);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  font-size:14px;
  color:var(--text);
  cursor:pointer;
  text-align:left;
  transition:transform var(--t) var(--spring-soft),border-color var(--t-fast),background var(--t-fast);
  animation:riseIn .4s var(--ease) backwards;
}
@media (hover:hover){.wv-result:hover{border-color:color-mix(in srgb, var(--accent) 45%, transparent);transform:translateX(3px)}}
.wv-result span{font-size:12px;color:var(--text-3)}
.wv-empty{font-size:13px;color:var(--text-3);margin:6px 2px}

/* 刷新提示 */
.wv-refresh{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin:22px auto 0;
  font-size:12.5px;
  color:var(--text-3);
}

@media (max-width:720px){
  .wv-page{padding:0 var(--gutter) 34px}
  .wv-hero{padding:20px;gap:15px;border-radius:26px}
  .wv-icon{font-size:42px}
  .wv-facts{grid-template-columns:repeat(2,1fr);border-radius:22px}
  .dy{grid-template-columns:48px 26px 34px 1fr 34px 38px;gap:6px;padding:11px 12px}
  .dy-l{font-size:12px}
}
</style>
</head>

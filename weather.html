<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天气 · 言一</title>

<script>
(function(){
  try{
    var t = localStorage.getItem('theme');
    if(!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if(t) document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">

<style>
/* =========================================================
   天气页
   ========================================================= */
.wv-page{
  max-width:820px;
  margin:0 auto;
  padding:0 24px 72px;
}

.wv-hero{
  display:flex;
  align-items:center;
  gap:20px;
  padding:24px 26px;
  margin-bottom:18px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:linear-gradient(140deg,var(--accent-soft),var(--surface) 62%);
  box-shadow:var(--shadow);
}
.wv-icon{font-size:52px;line-height:1;flex-shrink:0}
.wv-temp{
  font-family:var(--serif);
  font-size:clamp(38px,9vw,54px);
  font-weight:600;
  line-height:1;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.wv-desc{font-size:15px;color:var(--text-muted);margin:6px 0 0}
.wv-place{
  margin-left:auto;
  text-align:right;
  font-size:13px;
  color:var(--text-muted);
}
.wv-place b{
  display:block;
  font-size:16px;
  color:var(--text);
  font-weight:600;
  margin-bottom:4px;
}

.wv-facts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:20px;
}
.fact{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:12px 6px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface);
}
.fact b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.fact span{font-size:11.5px;color:var(--text-muted)}

.wv-sec{margin-bottom:22px}
.wv-sec-t{
  font-size:13px;
  letter-spacing:.1em;
  color:var(--text-muted);
  margin:0 0 10px;
}

/* 逐时 */
.wv-hourly{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 2px 12px;
  scroll-snap-type:x proximity;
}
.hr{
  flex:0 0 auto;
  width:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  padding:11px 4px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface);
  scroll-snap-align:start;
  font-variant-numeric:tabular-nums;
}
.hr.is-now{border-color:var(--accent);background:var(--accent-soft)}
.hr-h{font-size:11px;color:var(--text-muted)}
.hr.is-now .hr-h{color:var(--accent);font-weight:600}
.hr-i{font-size:17px;line-height:1}
.hr-t{font-size:14px;font-weight:600}
.hr-p{font-size:10.5px;color:var(--accent);min-height:14px}

/* 7 天 */
.wv-daily{
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--surface);
  overflow:hidden;
}
.dy{
  display:grid;
  grid-template-columns:56px 32px 42px 1fr 42px 44px;
  align-items:center;
  gap:8px;
  padding:11px 16px;
  border-bottom:1px solid var(--border);
  font-variant-numeric:tabular-nums;
}
.dy:last-child{border-bottom:0}
.dy-l{font-size:13px;color:var(--text-muted)}
.dy-i{font-size:17px;line-height:1;text-align:center}
.dy-lo,.dy-hi{font-size:13.5px;text-align:center}
.dy-hi{font-weight:600}
.dy-bar{
  position:relative;
  height:5px;
  border-radius:5px;
  background:var(--surface-2);
  overflow:hidden;
}
.dy-bar i{
  position:absolute;top:0;bottom:0;
  border-radius:5px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));
}
.dy-p{font-size:11.5px;color:var(--accent);text-align:right}

/* 地区切换 */
.wv-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{
  padding:6px 14px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--surface);
  font-family:inherit;
  font-size:13px;
  color:var(--text-muted);
  cursor:pointer;
  transition:color .22s,border-color .22s,background .22s,transform .22s;
}
.chip:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.chip.is-on{background:var(--accent);border-color:var(--accent);color:#fff}

.wv-search{
  width:100%;
  height:42px;
  padding:0 16px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--surface);
  font-family:inherit;
  font-size:14px;
  color:var(--text);
  outline:none;
  transition:border-color .22s,box-shadow .22s;
}
.wv-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wv-results{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.wv-result{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:11px 15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--surface);
  font-family:inherit;
  font-size:14px;
  color:var(--text);
  cursor:pointer;
  text-align:left;
  transition:border-color .22s,transform .22s;
}
.wv-result:hover{border-color:var(--accent);transform:translateX(3px)}
.wv-result span{font-size:12px;color:var(--text-muted)}
.wv-empty{font-size:13px;color:var(--text-muted);margin:6px 2px}

@media (max-width:720px){
  .wv-page{padding:0 20px 60px}
  .wv-hero{padding:18px;gap:14px}
  .wv-icon{font-size:38px}
  .wv-facts{grid-template-columns:repeat(2,1fr)}
  .dy{grid-template-columns:48px 26px 34px 1fr 34px 38px;gap:6px;padding:10px 12px}
  .dy-l{font-size:12px}
}
</style>
</head>

<body>

<header class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="index.html">
      <span class="brand-cn">言一</span>
      <span class="brand-py">Yán Yī</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-match="index.html calendar.html weather.html">首页</a>
      <a href="articles.html" data-match="articles.html">文章</a>
      <a href="notes.html" data-match="notes.html">随笔</a>
      <a href="gallery.html" data-match="gallery.html">相片馆</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/>
      </svg>
    </button>
  </div>
</header>

<div class="page">

  <header class="site-header" style="max-width:820px">
    <h1 class="page-title">天气</h1>
    <p class="page-sub">实时天气、未来 24 小时与 7 天预报，可切换任意地区。</p>
  </header>

  <main class="wv-page">

    <div class="wv-hero">
      <span class="wv-icon" id="wvIcon">⏳</span>
      <div>
        <p class="wv-temp" id="wvBig">--°</p>
        <p class="wv-desc" id="wvDesc">正在获取…</p>
      </div>
      <div class="wv-place">
        <b id="wvPlace">—</b>
        <span>实时天气</span>
      </div>
    </div>

    <div class="wv-facts" id="wvFacts"></div>

    <section class="wv-sec">
      <h3 class="wv-sec-t">未来 24 小时</h3>
      <div class="wv-hourly" id="wvHourly"></div>
    </section>

    <section class="wv-sec">
      <h3 class="wv-sec-t">未来 7 天<span class="push-right" id="wvSun" style="font-size:12px;opacity:.75"></span></h3>
      <div class="wv-daily" id="wvDaily"></div>
    </section>

    <section class="wv-sec">
      <h3 class="wv-sec-t">切换地区</h3>
      <div class="wv-chips" id="wvChips"></div>
      <input class="wv-search" id="wvSearch" type="search" placeholder="搜索城市，例如：青岛 / Tokyo" autocomplete="off">
      <div class="wv-results" id="wvResults"></div>
    </section>

  </main>

  <footer class="site-footer" style="max-width:820px">
    <p class="foot-line">© <span id="year">2025</span> 言一 · <a href="index.html">回到首页</a></p>
    <p class="foot-ver">version <span id="siteVersion">beta0.12</span></p>
  </footer>

</div>

<script src="assets/app.js" defer></script>
<script src="assets/weather.js" defer></script>

</body>
</html>

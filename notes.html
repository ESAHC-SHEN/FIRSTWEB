<style>
.notes{
  max-width:var(--narrow);
  margin:0 auto;
  padding:0 var(--gutter) 40px;
  display:flex;
  flex-direction:column;
  gap:15px;
}
.note{
  position:relative;
  padding:24px 26px 20px 30px;
  border-radius:var(--r-l);
}
.note::after{
  content:"";
  position:absolute;
  left:0;top:20px;bottom:20px;
  width:3px;
  border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--teal),var(--accent));
  opacity:.9;
}
.note-text{
  font-family:var(--serif);
  font-size:15.5px;
  line-height:1.92;
  letter-spacing:.005em;
  margin:0 0 13px;
  color:var(--text);
}
.note-text::before{content:"「"}
.note-text::after{content:"」"}

.note-meta{
  display:flex;align-items:center;gap:10px;
  font-size:12.5px;color:var(--text-3);
}
.note-anchor{
  color:inherit;text-decoration:none;opacity:.45;
  padding:2px 6px;
  border-radius:8px;
  transition:opacity var(--t-fast),color var(--t-fast),background var(--t-fast);
}
@media (hover:hover){.note-anchor:hover{opacity:1;color:var(--accent);background:var(--fill)}}

@media (max-width:720px){
  .notes{padding:0 var(--gutter) 30px}
  .note{padding:21px 19px 17px 23px;border-radius:21px}
  .note-text{font-size:15px;line-height:1.88}
  .note::after{top:17px;bottom:17px}
}
</style>
</head>

  <!-- 加新随笔：复制一个 <article class="note"> 整块 -->
  <main class="notes">

    <article class="note card spot" id="note-2024-11-09">
      <p class="note-text">今天在地铁上看到一个人读纸质书，手指夹在书页之间，像夹着一个秘密。</p>
      <div class="note-meta">
        <time datetime="2024-11-09">2024 年 11 月 9 日</time>
        <a class="note-anchor" href="#note-2024-11-09" aria-label="这则随笔的链接">#</a>
      </div>
    </article>

    <article class="note card spot" id="note-2024-10-21">
      <p class="note-text">关于「太晚开始」这件事：种一棵树最好的时间是十年前，其次是现在。这句话被说烂了，但每次真的动手时，还是会被它击中。</p>
      <div class="note-meta">
        <time datetime="2024-10-21">2024 年 10 月 21 日</time>
        <a class="note-anchor" href="#note-2024-10-21" aria-label="这则随笔的链接">#</a>
      </div>
    </article>

    <article class="note card spot" id="note-2024-10-05">
      <p class="note-text">重新读了一遍《海边的卡夫卡》，发现自己划线的地方和五年前完全不一样了。书没变，是读书的人换了。</p>
      <div class="note-meta">
        <time datetime="2024-10-05">2024 年 10 月 5 日</time>
        <a class="note-anchor" href="#note-2024-10-05" aria-label="这则随笔的链接">#</a>
      </div>
    </article>

  </main>

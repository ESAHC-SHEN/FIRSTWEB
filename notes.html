<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>随笔 · 言一</title>

<script>
(function(){
  try{
    var t = localStorage.getItem('theme');
    if(!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if(t) document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">

<style>
.notes{
  max-width:var(--narrow);
  margin:0 auto;
  padding:0 24px 84px;
  display:flex;
  flex-direction:column;
  gap:15px;
}
.note{
  position:relative;
  padding:24px 26px 20px 30px;
}
.note::before{
  content:"";
  position:absolute;
  left:0;top:20px;bottom:20px;
  width:3px;
  border-radius:0 3px 3px 0;
  background:var(--accent-2);
  opacity:.85;
}
.note-text{
  font-family:var(--serif);
  font-size:15.5px;
  line-height:1.9;
  margin:0 0 13px;
  color:var(--text);
}
.note-text::before{content:"「"}
.note-text::after{content:"」"}

.note-meta{
  display:flex;align-items:center;gap:10px;
  font-size:12.5px;color:var(--text-muted);
}
.note-anchor{
  color:inherit;text-decoration:none;opacity:.5;
  transition:opacity .2s,color .2s;
}
.note-anchor:hover{opacity:1;color:var(--accent-2)}

@media (max-width:720px){
  .notes{padding:0 20px 66px}
  .note{padding:21px 19px 17px 23px}
  .note-text{font-size:15px}
  .note::before{top:17px;bottom:17px}
}
</style>
</head>

<body>

<header class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="index.html">
      <span class="brand-cn">言一</span>
      <span class="brand-py">Yán Yī</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="articles.html">文章</a>
      <a href="notes.html">随笔</a>
      <a href="gallery.html">相片馆</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/>
      </svg>
    </button>
  </div>
</header>

<div class="page">

  <header class="site-header" style="max-width:var(--narrow)">
    <h1 class="page-title">随笔</h1>
    <p class="page-sub">一两句话的碎片。最新的排在最前面。</p>
  </header>

  <!-- 加新随笔：复制一个 <article class="note"> 整块 -->
  <main class="notes">

    <article class="note card" id="note-2024-11-09">
      <p class="note-text">今天在地铁上看到一个人读纸质书，手指夹在书页之间，像夹着一个秘密。</p>
      <div class="note-meta">
        <time datetime="2024-11-09">2024 年 11 月 9 日</time>
        <a class="note-anchor" href="#note-2024-11-09" aria-label="这则随笔的链接">#</a>
      </div>
    </article>

    <article class="note card" id="note-2024-10-21">
      <p class="note-text">关于「太晚开始」这件事：种一棵树最好的时间是十年前，其次是现在。这句话被说烂了，但每次真的动手时，还是会被它击中。</p>
      <div class="note-meta">
        <time datetime="2024-10-21">2024 年 10 月 21 日</time>
        <a class="note-anchor" href="#note-2024-10-21" aria-label="这则随笔的链接">#</a>
      </div>
    </article>

    <article class="note card" id="note-2024-10-05">
      <p class="note-text">重新读了一遍《海边的卡夫卡》，发现自己划线的地方和五年前完全不一样了。书没变，是读书的人换了。</p>
      <div class="note-meta">
        <time datetime="2024-10-05">2024 年 10 月 5 日</time>
        <a class="note-anchor" href="#note-2024-10-05" aria-label="这则随笔的链接">#</a>
      </div>
    </article>

  </main>

  <footer class="site-footer" style="max-width:var(--narrow)">
    <p class="foot-line">© <span id="year">2025</span> 言一 · <a href="index.html">回到首页</a></p>
    <p class="foot-ver">version <span id="siteVersion">beta0.11</span></p>
  </footer>

</div>

<script src="assets/app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  YY.animate('.note');
});
</script>

</body>
</html>

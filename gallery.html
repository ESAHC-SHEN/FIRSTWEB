<head>

<title>相片馆 · 言一</title>

<script>
(function(){
  try{
    var t = localStorage.getItem('theme');
    if(!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if(t) document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

<style>
.gallery{
  max-width:var(--maxw);
  margin:0 auto;
  padding:0 24px 84px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  gap:20px;
  align-items:start;
}
.pic{margin:0;overflow:hidden}
.pic--wide{grid-column:1/-1}

.pic-btn{
  display:block;width:100%;padding:0;border:0;
  background:var(--surface-2);cursor:zoom-in;overflow:hidden;
}
.pic-btn img{
  width:100%;aspect-ratio:1;object-fit:cover;
  transition:transform .7s cubic-bezier(.2,.8,.2,1);
}
.pic--wide .pic-btn img{aspect-ratio:3/2}
.pic:hover .pic-btn img{transform:scale(1.045)}
/* 竖构图：给 figure 加 class="pic--portrait"
.pic--portrait .pic-btn img{aspect-ratio:3/4}
*/

.pic-cap{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:13px 17px 15px;
  font-size:13.5px;color:var(--text);
}
.pic-cap .place{font-size:12px;color:var(--text-muted);opacity:.8;white-space:nowrap}

/* 灯箱 */
.lightbox{
  position:fixed;inset:0;z-index:300;
  display:flex;align-items:center;justify-content:center;
  padding:48px 76px;
  background:rgba(6,10,16,.94);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
.lightbox.is-open{opacity:1;pointer-events:auto}
.lightbox img{
  max-width:100%;max-height:100%;object-fit:contain;
  border-radius:10px;
  transform:scale(.95);
  transition:transform .36s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.9);
}
.lightbox.is-open img{transform:scale(1)}

.lb-close{
  position:absolute;top:20px;right:24px;
  width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  color:#fff;font-size:24px;line-height:1;
  cursor:pointer;display:grid;place-items:center;
  transition:background .22s,transform .22s;
}
.lb-close:hover{background:rgba(255,255,255,.16);transform:rotate(90deg)}

.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  color:#fff;font-size:26px;line-height:1;
  cursor:pointer;display:grid;place-items:center;
  transition:background .22s;user-select:none;
}
.lb-nav:hover{background:rgba(255,255,255,.16)}
.lb-prev{left:18px}
.lb-next{right:18px}

.lb-cap{
  position:absolute;bottom:42px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.9);font-size:13.5px;
  max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lb-count{
  position:absolute;bottom:19px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.6);font-size:12.5px;
  font-variant-numeric:tabular-nums;letter-spacing:.06em;
}

@media (max-width:720px){
  .gallery{padding:0 20px 66px;grid-template-columns:1fr;gap:16px}
  .lightbox{padding:62px 12px}
  .lb-nav{width:40px;height:40px;font-size:22px}
  .lb-prev{left:8px}
  .lb-next{right:8px}
  .lb-cap{bottom:38px;font-size:13px}
}
</style>
</head>

<body>

        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>

        <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/>
      </svg>
    </button>
  </div>

</div>

<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="图片放大查看">
  <button class="lb-close" id="lbClose" aria-label="关闭">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="上一张">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" id="lbNext" aria-label="下一张">›</button>
  <div class="lb-cap" id="lbCap"></div>
  <div class="lb-count" id="lbCount"></div>
</div>

<script src="assets/app.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  var figures = Array.prototype.slice.call(document.querySelectorAll('.pic'));

  var photos = figures.map(function (fig) {
    var img = fig.querySelector('img');
    var cap = fig.querySelector('.pic-cap');
    var placeEl = cap ? cap.querySelector('.place') : null;
    var title = '';
    if (cap) {
      var clone = cap.cloneNode(true);
      var p = clone.querySelector('.place');
      if (p) p.remove();
      title = clone.textContent.trim();
    }
    return {
      full: (img && img.getAttribute('data-full')) || (img && img.getAttribute('src')) || '',
      alt: (img && img.getAttribute('alt')) || '',
      title: title,
      place: placeEl ? placeEl.textContent.trim() : ''
    };
  });

  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');
  var lbCount = document.getElementById('lbCount');
  var lbClose = document.getElementById('lbClose');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');

  var current = 0, lastFocused = null;

  if (photos.length <= 1) {
    lbPrev.style.display = 'none';
    lbNext.style.display = 'none';
  }

  function render(i) {
    if (!photos.length) return;
    current = (i % photos.length + photos.length) % photos.length;
    var p = photos[current];
    lbImg.src = p.full;
    lbImg.alt = p.alt;
    lbCap.textContent = [p.title, p.place].filter(Boolean).join(' · ');
    lbCount.textContent = photos.length > 1 ? (current + 1) + ' / ' + photos.length : '';
  }

  function open(i) {
    if (!photos.length) return;
    lastFocused = document.activeElement;
    render(i);
    lb.classList.add('is-open');
    lb.setAttribute('aria-hidden', 'false');
    document.documentElement.style.overflow = 'hidden';
    lbClose.focus();
  }

  function close() {
    lb.classList.remove('is-open');
    lb.setAttribute('aria-hidden', 'true');
    document.documentElement.style.overflow = '';
    lbImg.src = '';
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  figures.forEach(function (fig, i) {
    var btn = fig.querySelector('.pic-btn') || fig;
    btn.addEventListener('click', function () { open(i); });
  });

  lbClose.addEventListener('click', close);
  lbPrev.addEventListener('click', function (e) { e.stopPropagation(); render(current - 1); });
  lbNext.addEventListener('click', function (e) { e.stopPropagation(); render(current + 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });

  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('is-open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') render(current - 1);
    else if (e.key === 'ArrowRight') render(current + 1);
  });

  var sx = 0;
  lb.addEventListener('touchstart', function (e) { sx = e.changedTouches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (photos.length < 2) return;
    var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 50) render(dx < 0 ? current + 1 : current - 1);
  }, { passive: true });

  YY.animate('.pic');

  document.querySelectorAll('.pic-btn img').forEach(function (img) {
    img.addEventListener('error', function () {
      img.style.display = 'none';
      var btn = img.parentElement;
      if (btn) {
        btn.style.display = 'grid';
        btn.style.placeItems = 'center';
        btn.style.minHeight = '180px';
        btn.style.fontSize = '13px';
        btn.style.color = 'var(--text-muted)';
        btn.textContent = '图片加载失败：请检查 src 路径';
      }
    });
  });
});
</script>

<style>
/* =========================================================
   相片馆
   缩略图优先 + 模糊占位 + 灯箱 + 照片压缩
   ========================================================= */
.gal-stats{
  max-width:var(--maxw);
  margin:0 auto 22px;
  padding:0 var(--gutter);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.gs{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:14px 10px;
  border-radius:var(--r-l);
  background:var(--glass-thin);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--sheen);
}
.gs b{font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.gs span{font-size:11.5px;color:var(--text-2)}
.gs--hi b{background:linear-gradient(100deg,var(--accent),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}

.gal-tools{
  max-width:var(--maxw);
  margin:0 auto 18px;
  padding:0 var(--gutter);
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.gal-tools .hint{font-size:12.5px;color:var(--text-3);margin-left:auto}

/* ---------- 网格 ---------- */
.gallery{
  max-width:var(--maxw);
  margin:0 auto;
  padding:0 var(--gutter) 60px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,288px),1fr));
  gap:14px;
  align-items:start;
}

.pic{
  position:relative;
  margin:0;
  border-radius:var(--r-l);
  overflow:hidden;
  background:var(--fill);
  box-shadow:var(--sh-1), inset 0 0 0 1px var(--line);
  transition:transform .55s var(--spring-soft), box-shadow .55s var(--spring-soft);
  aspect-ratio:1;
}
.pic--wide{grid-column:1/-1;aspect-ratio:3/2}
@media (hover:hover){
  .pic:hover{transform:translateY(-4px);box-shadow:var(--sh-3)}
  .pic:hover .pic-btn img{transform:scale(1.055)}
}

.pic-btn{
  position:relative;
  display:block;
  width:100%;height:100%;
  padding:0;
  border:0;
  background:var(--fill);
  cursor:zoom-in;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
/* 模糊占位：图片解码完成前先给一层极小的内联图，避免白块与跳动 */
.pic-btn::before{
  content:"";
  position:absolute;
  inset:-6%;
  background-image:var(--lqip,none);
  background-size:cover;
  background-position:center;
  filter:blur(16px);
  transform:scale(1.06);
  transition:opacity .55s var(--ease);
}
.pic.is-loaded .pic-btn::before{opacity:0}

.pic-btn img{
  position:relative;
  width:100%;height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1);
  transition:opacity .6s var(--ease), transform .85s var(--spring-soft);
}
.pic.is-loaded .pic-btn img{opacity:1}

.pic-cap{
  position:absolute;
  left:0;right:0;bottom:0;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  padding:26px 15px 12px;
  font-size:13.5px;
  font-weight:500;
  color:#fff;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.44));
  pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
}
.pic-cap .place{font-size:11.5px;opacity:.82;white-space:nowrap}

/* ---------- 灯箱 ---------- */
.lightbox{
  position:fixed;
  inset:0;
  z-index:700;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:56px 78px 84px;
  background:rgba(6,8,14,.7);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  backdrop-filter:blur(26px) saturate(160%);
  opacity:0;
  pointer-events:none;
  transition:opacity .34s var(--ease);
}
.lightbox.is-open{opacity:1;pointer-events:auto}
.lb-stage{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;height:100%;
  touch-action:none;
}
.lb-stage img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:14px;
  box-shadow:0 44px 90px -34px rgba(0,0,0,.85), 0 0 0 .5px rgba(255,255,255,.14);
  will-change:transform;
}
.lb-stage img.is-loading{opacity:.55}

.lb-close{
  position:absolute;
  top:18px;right:20px;
  width:40px;height:40px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);
  color:#fff;
  z-index:3;
}
@media (hover:hover){.lb-close:hover{background:rgba(255,255,255,.2)}}

.lb-nav{
  position:absolute;
  top:50%;
  margin-top:-24px;
  width:48px;height:48px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  color:#fff;
  cursor:pointer;
  display:grid;
  place-items:center;
  z-index:3;
  -webkit-tap-highlight-color:transparent;
  transition:transform .3s var(--spring), background .22s;
}
@media (hover:hover){.lb-nav:hover{background:rgba(255,255,255,.2);transform:scale(1.06)}}
.lb-nav:active{transform:scale(.92)}
.lb-nav svg{width:22px;height:22px}
.lb-prev{left:18px}
.lb-next{right:18px}

.lb-info{
  position:absolute;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:3;
  display:flex;
  align-items:center;
  gap:12px;
  max-width:88vw;
  padding:9px 16px;
  border-radius:var(--r-full);
  background:rgba(28,28,30,.55);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 18px 40px -18px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.16);
  color:#fff;
  font-size:13px;
  white-space:nowrap;
}
.lb-info .sep{width:1px;height:14px;background:rgba(255,255,255,.22)}
.lb-cap{max-width:44vw;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.lb-count,.lb-size{font-size:12.5px;opacity:.78;font-variant-numeric:tabular-nums}
.lb-size{color:#7ee0a1}

.lb-loader{
  position:absolute;
  top:50%;left:50%;
  width:30px;height:30px;
  margin:-15px 0 0 -15px;
  border-radius:50%;
  border:2.5px solid rgba(255,255,255,.22);
  border-top-color:#fff;
  animation:spin .9s linear infinite;
  opacity:0;
  transition:opacity .2s;
  z-index:2;
}
.lb-loader.is-on{opacity:1}

/* ---------- 压缩工具 ---------- */
.drop{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding:26px 18px 22px;
  text-align:center;
  border-radius:var(--r-l);
  border:1.5px dashed color-mix(in srgb, var(--accent) 40%, var(--line));
  background:color-mix(in srgb, var(--accent) 5%, transparent);
  transition:background var(--t-fast), border-color var(--t-fast), transform var(--t-fast) var(--spring);
}
.drop.is-over{background:color-mix(in srgb, var(--accent) 14%, transparent);transform:scale(1.008)}
.drop-icon{
  display:grid;place-items:center;
  width:46px;height:46px;
  border-radius:16px;
  background:linear-gradient(150deg,var(--accent),var(--purple));
  color:#fff;
  box-shadow:0 10px 22px -10px color-mix(in srgb, var(--accent) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.4);
  margin-bottom:2px;
}
.drop-icon svg{width:24px;height:24px}
.drop b{font-size:15px;font-weight:600}
.drop span{font-size:12.5px;color:var(--text-2)}
.drop .btn{margin-top:9px}

.zip-opts{margin-top:18px;display:flex;flex-direction:column;gap:15px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt-head{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500}
.opt-head .val{margin-left:auto;font-size:13px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.opt-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.presets{display:flex;gap:7px;flex-wrap:wrap}

.zip-sum{
  display:none;
  margin-top:18px;
  padding:13px 16px;
  border-radius:var(--r-m);
  background:color-mix(in srgb, var(--green) 13%, transparent);
  border:1px solid color-mix(in srgb, var(--green) 25%, transparent);
  font-size:13.5px;
  line-height:1.6;
}
.zip-sum.is-on{display:block}
.zip-sum b{font-weight:600}

.zip-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.zip-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  border-radius:var(--r-m);
  background:var(--fill);
  animation:riseIn .4s var(--ease) both;
}
.zip-thumb{
  flex:0 0 auto;
  width:52px;height:52px;
  border-radius:12px;
  object-fit:cover;
  background:var(--fill-2);
}
.zip-meta{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:2px}
.zip-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zip-line{font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.zip-line em{font-style:normal;color:var(--green);font-weight:600}
.zip-save{font-size:11.5px;font-weight:600;color:var(--green)}
.zip-dl{flex:0 0 auto}

@media (max-width:720px){
  .gallery{padding:0 var(--gutter) 46px;gap:11px}
  .pic--wide{aspect-ratio:4/3}
  .gal-stats{grid-template-columns:1fr 1fr;gap:8px}
  .gs{padding:11px 8px}
  .lightbox{padding:52px 10px 96px}
  .lb-nav{width:42px;height:42px;margin-top:-21px}
  .lb-prev{left:6px}
  .lb-next{right:6px}
  .lb-info{gap:9px;padding:8px 13px;font-size:12.5px}
  .lb-cap{max-width:38vw}
  .gal-tools .hint{display:none}
}
</style>
</head>

<!-- ============ 灯箱 ============ -->
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="图片放大查看">
  <button class="icon-btn lb-close" id="lbClose" type="button" aria-label="关闭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
  </button>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="上一张">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
  </button>
  <div class="lb-stage" id="lbStage">
    <div class="lb-loader" id="lbLoader" aria-hidden="true"></div>
    <img id="lbImg" src="" alt="">
  </div>
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="下一张">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
  </button>
  <div class="lb-info">
    <span class="lb-cap" id="lbCap"></span>
    <span class="sep" id="lbSep"></span>
    <span class="lb-size" id="lbSize"></span>
    <span class="sep" id="lbSep2"></span>
    <span class="lb-count" id="lbCount"></span>
  </div>
</div>

<!-- ============ 照片压缩 ============ -->
<div class="sheet" id="zipSheet" aria-hidden="true">
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="zipTitle">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <div>
        <h2 class="sheet-title" id="zipTitle">照片压缩</h2>
        <p class="sheet-sub">纯本地处理，照片不会离开这台设备</p>
      </div>
      <button class="btn btn--sm push-right" type="button" data-sheet-close>完成</button>
    </div>

    <div class="sheet-body">

      <div class="drop" id="zipDrop">
        <input type="file" id="zipInput" accept="image/*" multiple hidden>
        <div class="drop-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="4.6" width="17.2" height="14.8" rx="3.4"/><circle cx="9" cy="10" r="1.6"/><path d="m4.6 16.6 4.9-4.4 3.9 3.5 3-2.5 3.2 2.9"/></svg>
        </div>
        <b>拖入照片，或点击选择</b>
        <span>支持 JPG / PNG / WebP · 可一次选多张</span>
        <button class="btn btn--primary" id="zipPick" type="button">选择照片</button>
      </div>

      <div class="zip-opts">

        <div class="opt">
          <div class="opt-head">
            <span>压缩质量</span>
            <span class="val" id="zipQualityVal">78%</span>
          </div>
          <input class="slider" id="zipQuality" type="range" min="40" max="95" step="1" value="78" aria-label="压缩质量">
        </div>

        <div class="opt">
          <div class="opt-head"><span>最长边上限</span><span class="val" id="zipEdgeVal">1920 px</span></div>
          <div class="segmented" id="zipEdge" role="tablist" aria-label="最长边">
            <span class="seg-thumb" aria-hidden="true"></span>
            <button class="seg-item" type="button" role="tab" data-edge="1280">1280</button>
            <button class="seg-item is-on" type="button" role="tab" data-edge="1920" aria-selected="true">1920</button>
            <button class="seg-item" type="button" role="tab" data-edge="2560">2560</button>
            <button class="seg-item" type="button" role="tab" data-edge="0">原始</button>
          </div>
        </div>

        <div class="opt">
          <div class="opt-head"><span>输出格式</span><span class="val" id="zipFmtVal">WebP</span></div>
          <div class="segmented" id="zipFmt" role="tablist" aria-label="输出格式">
            <span class="seg-thumb" aria-hidden="true"></span>
            <button class="seg-item is-on" type="button" role="tab" data-fmt="auto" aria-selected="true">自动</button>
            <button class="seg-item" type="button" role="tab" data-fmt="image/webp">WebP</button>
            <button class="seg-item" type="button" role="tab" data-fmt="image/jpeg">JPEG</button>
          </div>
        </div>

        <div class="opt">
          <div class="opt-head"><span>常用预设</span></div>
          <div class="presets">
            <button class="chip" type="button" data-preset="sharp">高清优先</button>
            <button class="chip is-on" type="button" data-preset="balanced">均衡</button>
            <button class="chip" type="button" data-preset="small">体积优先</button>
          </div>
        </div>

      </div>

      <div class="zip-sum" id="zipSum"></div>
      <div class="zip-list" id="zipList"></div>
    </div>
  </div>
</div>

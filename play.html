/* =========================================================
   娱乐页
   一言 / 白噪音 / 摸鱼四件套
   ========================================================= */
.play{
  max-width:var(--maxw);
  margin:0 auto;
  padding:0 var(--gutter) 44px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* ---------- 一言 ---------- */
.quote{
  position:relative;
  padding:34px 34px 24px;
  border-radius:var(--r-xl);
  overflow:hidden;
  text-align:center;
}
.quote::before{
  content:"“";
  position:absolute;
  top:-12px;left:18px;
  font-family:var(--serif);
  font-size:130px;
  font-weight:700;
  color:color-mix(in srgb, var(--accent) 13%, transparent);
  pointer-events:none;
  line-height:1;
}
.quote-text{
  position:relative;
  font-family:var(--serif);
  font-size:clamp(18px,3.4vw,23px);
  font-weight:600;
  line-height:1.85;
  letter-spacing:.01em;
  margin:6px auto 12px;
  max-width:34em;
  transition:opacity .26s var(--ease), transform .26s var(--ease);
}
.quote-from{
  position:relative;
  font-size:13px;
  color:var(--text-3);
  margin:0 0 18px;
  transition:opacity .26s var(--ease);
}
.quote.is-switching .quote-text{opacity:0;transform:translateY(8px)}
.quote.is-switching .quote-from{opacity:0}
.quote-actions{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
  padding-top:15px;
  border-top:1px solid var(--line);
}

/* ---------- 白噪音 ---------- */
.noise{
  display:flex;
  align-items:center;
  gap:18px;
  padding:22px 26px;
  border-radius:var(--r-xl);
}
.noise-btn{
  flex:0 0 auto;
  width:58px;height:58px;
  border:0;
  border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(150deg,var(--teal),var(--accent));
  color:#fff;
  cursor:pointer;
  box-shadow:0 14px 28px -12px color-mix(in srgb, var(--accent) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform var(--t) var(--spring), box-shadow var(--t);
  -webkit-tap-highlight-color:transparent;
}
@media (hover:hover){.noise-btn:hover{transform:scale(1.06)}}
.noise-btn:active{transform:scale(.93)}
.noise-btn svg{width:22px;height:22px}
.noise-btn .icon-pause{display:none}
.noise.is-on .noise-btn .icon-play{display:none}
.noise.is-on .noise-btn .icon-pause{display:block}
.noise.is-on .noise-btn{animation:breathe 2.6s var(--ease-in-out) infinite}
@keyframes breathe{0%,100%{box-shadow:0 14px 28px -12px color-mix(in srgb,var(--accent) 80%,transparent),0 0 0 0 color-mix(in srgb,var(--accent) 32%,transparent)}50%{box-shadow:0 14px 28px -12px color-mix(in srgb,var(--accent) 80%,transparent),0 0 0 11px transparent}}
.noise-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:11px}
.noise-title{display:flex;align-items:baseline;gap:9px}
.noise-title b{font-family:var(--serif);font-size:17px;font-weight:600}
.noise-title span{font-size:12px;color:var(--text-3)}
.noise-row{display:flex;align-items:center;gap:12px}
.noise-vol{display:flex;align-items:center;gap:8px;flex:0 0 168px}
.noise-vol svg{width:16px;height:16px;color:var(--text-3);flex:0 0 auto}
.noise-vol .slider{height:24px}
.noise-eq{
  flex:0 0 auto;
  display:flex;align-items:flex-end;gap:2.5px;
  height:18px;
}
.noise-eq i{
  width:3px;border-radius:2px;
  background:linear-gradient(180deg,var(--teal),var(--accent));
  height:4px;
  opacity:.35;
  transition:opacity var(--t);
}
.noise.is-on .noise-eq i{opacity:.9;animation:eq 1s ease-in-out infinite}
.noise.is-on .noise-eq i:nth-child(2){animation-delay:.18s}
.noise.is-on .noise-eq i:nth-child(3){animation-delay:.36s}
.noise.is-on .noise-eq i:nth-child(4){animation-delay:.09s}
.noise.is-on .noise-eq i:nth-child(5){animation-delay:.27s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}

/* ---------- 摸鱼四件套 ---------- */
.toys{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.toy{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:13px;
  padding:26px 22px 22px;
  border-radius:var(--r-xl);
  text-align:center;
}
.toy-title{
  font-family:var(--serif);
  font-size:17px;font-weight:600;
  margin:0;
}
.toy-hint{font-size:12.5px;color:var(--text-3);margin:-7px 0 0}
.toy-stage{
  min-height:86px;
  display:grid;
  place-items:center;
  width:100%;
}
.toy-result{
  font-family:var(--serif);
  font-size:clamp(20px,3.6vw,26px);
  font-weight:600;
  line-height:1.6;
  letter-spacing:.01em;
}
.toy-result.small{font-size:16.5px;font-weight:400;font-family:var(--font);color:var(--text-2)}

/* 硬币 */
.coin{
  width:76px;height:76px;
  border-radius:50%;
  display:grid;place-items:center;
  font-family:var(--serif);
  font-size:26px;font-weight:700;
  color:#8a6414;
  background:radial-gradient(circle at 34% 30%,#ffe9a8,#f5c842 58%,#d9a41f);
  box-shadow:0 12px 24px -10px rgba(190,140,20,.6), inset 0 2px 3px rgba(255,255,255,.75), inset 0 -3px 6px rgba(140,95,5,.35);
  user-select:none;
}
.coin.is-flip{animation:flip .9s var(--ease)}
@keyframes flip{
  0%{transform:rotateY(0) translateY(0)}
  35%{transform:rotateY(540deg) translateY(-26px) scale(1.06)}
  100%{transform:rotateY(1080deg) translateY(0)}
}
[data-theme="dark"] .coin{color:#5e430c}

/* 骰子 */
.die{
  width:76px;height:76px;
  border-radius:19px;
  display:grid;place-items:center;
  font-size:44px;
  line-height:1;
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:var(--sh-2), inset 0 1px 0 var(--sheen);
  user-select:none;
}
.die.is-roll{animation:tumble .7s var(--ease)}
@keyframes tumble{
  0%{transform:rotate(0) scale(1)}
  40%{transform:rotate(235deg) scale(1.14) translateY(-16px)}
  100%{transform:rotate(360deg) scale(1)}
}

/* 决定器 */
.toy-textarea{
  width:100%;
  min-height:74px;
  resize:vertical;
  padding:11px 14px;
  border:1px solid var(--line);
  border-radius:var(--r-m);
  background:var(--glass-thin);
  font-size:13.5px;
  line-height:1.7;
  outline:none;
  transition:border-color var(--t-fast), box-shadow var(--t-fast);
}
.toy-textarea:focus{
  border-color:color-mix(in srgb, var(--accent) 60%, transparent);
  box-shadow:0 0 0 3.5px color-mix(in srgb, var(--accent) 15%, transparent);
}
.toy-slot{transition:transform .1s}
.toy-slot.is-spin{transform:scale(1.04)}

@media (max-width:860px){
  .toys{grid-template-columns:1fr}
}
@media (max-width:720px){
  .play{padding:0 var(--gutter) 32px;gap:14px}
  .quote{padding:26px 20px 19px;border-radius:26px}
  .noise{flex-wrap:wrap;padding:18px;border-radius:26px}
  .noise-row{flex-wrap:wrap}
  .noise-vol{flex:1 1 100%}
  .toy{padding:22px 18px 18px;border-radius:26px}
}
</style>

      </button>
      <div class="noise-body">
        <div class="noise-title">
          <b>白噪音</b>
          <span id="noiseState">本地合成 · 不需要网络</span>
        </div>
        <div class="segmented" id="noiseSeg" role="tablist" aria-label="噪音类型" style="align-self:flex-start">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button class="seg-item" type="button" role="tab" data-noise="white" aria-selected="false">白噪</button>
          <button class="seg-item" type="button" role="tab" data-noise="pink" aria-selected="false">粉噪</button>
          <button class="seg-item is-on" type="button" role="tab" data-noise="brown" aria-selected="true">棕噪</button>
          <button class="seg-item" type="button" role="tab" data-noise="rain" aria-selected="false">雨声</button>
        </div>
        <div class="noise-row">
          <span class="noise-vol">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.6V5.4L7.5 9.5z" fill="currentColor" stroke="none"/><path d="M15.5 9a4.3 4.3 0 0 1 0 6M18 6.6a8 8 0 0 1 0 10.8"/></svg>
            <input class="slider" id="noiseVol" type="range" min="0" max="100" step="1" value="55" aria-label="音量">
          </span>
          <span class="noise-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
    </section>

    <!-- ============ 摸鱼四件套 ============ -->
    <section aria-label="摸鱼小工具">
      <p class="section-label">摸鱼四件套</p>
      <div class="toys">

        <div class="toy card spot">
          <h2 class="toy-title">抛硬币</h2>
          <p class="toy-hint">犹豫的时候，让硬币先选</p>
          <div class="toy-stage">
            <div class="coin" id="coin">?</div>
          </div>
          <button class="btn btn--tint btn--sm" id="coinBtn" type="button">抛一次</button>
        </div>

        <div class="toy card spot">
          <h2 class="toy-title">骰子</h2>

        </div>

        <div class="toy card spot">

          <div class="toy-stage" style="align-content:start;gap:10px">
            <textarea class="toy-textarea" id="pickOpts" rows="3" aria-label="候选选项，一行一个">食堂
外卖
自己煮
不吃了减肥</textarea>
            <p class="toy-result toy-slot" id="pickResult" style="min-height:1.6em"></p>
          </div>
          <button class="btn btn--tint btn--sm" id="pickBtn" type="button">帮我选</button>

        <div class="toy card spot">

          <button class="btn btn--tint btn--sm" id="bookBtn" type="button">翻开一页</button>

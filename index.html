<!-- 尽早应用主题，避免刷新时闪白 -->
<script>
(function(){
  try{
    var t = localStorage.getItem('theme');
    if(!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if(t) document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ 设计变量 ============ */
*,*::before,*::after{box-sizing:border-box}

:root{
  --bg:#f7f5f1;
  --surface:#ffffff;
  --surface-2:#f0ede7;
  --text:#1a1917;
  --text-muted:#7a756d;
  --border:#e8e4dc;
  --accent:#c9552f;
  --accent-soft:#f8e9e3;
  --radius:18px;
  --shadow:0 1px 2px rgba(28,27,25,.03),0 4px 16px -8px rgba(28,27,25,.10);
  --shadow-hover:0 2px 6px rgba(28,27,25,.05),0 22px 44px -22px rgba(28,27,25,.28);
  --maxw:1100px;
  --serif:"Noto Serif SC",Georgia,"Songti SC","STSong",serif;
}

[data-theme="dark"]{
  --bg:#131215;
  --surface:#1c1b1f;
  --surface-2:#26242a;
  --text:#ece9e3;
  --text-muted:#948f88;
  --border:#2b2930;
  --accent:#e5794f;
  --accent-soft:#33231c;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-hover:0 26px 52px -26px rgba(0,0,0,.9);
}

/* ============ 基础 ============ */
html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;
}

/* 顶部氛围光 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(900px 480px at 12% -8%, rgba(201,85,47,.09), transparent 62%),
    radial-gradient(700px 420px at 92% 4%, rgba(90,130,180,.07), transparent 60%);
  pointer-events:none;
  z-index:0;
}
[data-theme="dark"] body::before{
  background:
    radial-gradient(900px 480px at 12% -8%, rgba(229,121,79,.12), transparent 62%),
    radial-gradient(700px 420px at 92% 4%, rgba(90,130,180,.10), transparent 60%);
}

.page{position:relative;z-index:1}

img{display:block;max-width:100%}

/* ============ 入场动画 ============ */
@keyframes riseIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
/* 用 backwards 而不是 both：
   both 会让动画结束后继续保留 transform:none，
   从而盖掉 hover 的 translateY，卡片就"浮不起来"了 */
.enter{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) backwards}

/* ============ 顶部栏：导航 + 主题 ============ */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:30px;
}

.site-nav{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
}
.site-nav a{
  font-size:13px;
  color:var(--text-muted);
  text-decoration:none;
  padding:5px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  transition:color .2s,border-color .2s,transform .2s;
}
.site-nav a:hover{
  color:var(--accent);
  border-color:var(--accent);
  transform:translateY(-1px);
}
.site-nav a.is-active{
  color:var(--bg);
  background:var(--text);
  border-color:var(--text);
}

/* ============ 头部 ============ */
.site-header{
  max-width:var(--maxw);
  margin:0 auto;
  padding:44px 24px 34px;
}

.profile{
  display:flex;
  gap:26px;
  align-items:center;
}

.avatar{
  width:92px;
  height:92px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
  background:var(--surface-2);
  box-shadow:0 0 0 4px var(--surface), 0 0 0 5px var(--border), 0 14px 28px -14px rgba(0,0,0,.35);
}

.profile-info h1{
  font-family:var(--serif);
  font-size:clamp(26px,5vw,36px);
  font-weight:700;
  letter-spacing:-.01em;
  margin:0 0 6px;
  line-height:1.25;
}

.bio{
  margin:0 0 14px;
  color:var(--text-muted);
  font-size:15px;
  max-width:46ch;
  line-height:1.75;
}

/* ---- 社交 / 联系方式 ---- */
.socials{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
}
.socials a,
.socials .social-text{
  font-size:13px;
  color:var(--text-muted);
  text-decoration:none;
  padding:5px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  transition:color .2s,border-color .2s,transform .2s;
}
.socials a:hover{
  color:var(--accent);
  border-color:var(--accent);
  transform:translateY(-1px);
}
.socials .social-text{
  cursor:default;
  -webkit-user-select:text;
  user-select:text;
  font-variant-numeric:tabular-nums;
}

/* 主题切换 */
.theme-toggle{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:color .25s,border-color .25s,transform .25s,background .25s;
}
.theme-toggle:hover{
  color:var(--accent);
  border-color:var(--accent);
  transform:rotate(18deg);
}
.theme-toggle svg{width:18px;height:18px}
.theme-toggle .icon-moon{display:none}
[data-theme="dark"] .theme-toggle .icon-sun{display:none}
[data-theme="dark"] .theme-toggle .icon-moon{display:block}

/* ============ 实时状态条（时间 / 天气） ============ */
.status-bar{
  max-width:var(--maxw);
  margin:0 auto 34px;
  padding:0 24px;
}

.status-inner{
  display:flex;
  align-items:center;
  gap:24px;
  flex-wrap:wrap;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px 26px;
  box-shadow:var(--shadow);
}

.status-group{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.status-svg{
  width:22px;
  height:22px;
  color:var(--accent);
  flex-shrink:0;
}

.status-icon{
  font-size:20px;
  line-height:1;
  width:22px;
  text-align:center;
  flex-shrink:0;
}

.status-text{
  display:flex;
  flex-direction:column;
  line-height:1.4;
  min-width:0;
}

.status-text strong{
  font-size:16px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
  white-space:nowrap;
  color:var(--text);
}

.status-text small{
  font-size:12.5px;
  color:var(--text-muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status-sep{
  width:1px;
  height:32px;
  background:var(--border);
  flex-shrink:0;
}

/* ============ 三个专栏大块 ============ */
.columns{
  max-width:var(--maxw);
  margin:0 auto;
  padding:0 24px 90px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));
  gap:22px;
  align-items:stretch;
}

.col{
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:250px;
  padding:32px 28px 24px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  text-decoration:none;
  color:inherit;
  overflow:hidden;
  transition:transform .4s cubic-bezier(.2,.8,.2,1),
             box-shadow .4s cubic-bezier(.2,.8,.2,1),
             border-color .3s;
}
.col::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:150px;
  background:radial-gradient(120% 100% at 14% 0%, var(--tint-soft), transparent 70%);
  pointer-events:none;
}
.col:hover{
  transform:translateY(-5px);
  border-color:transparent;
  box-shadow:var(--shadow-hover);
}

/* 每栏一个色（与正文 .tag 的暖色同族，另加青绿、蓝灰各一支） */
.col--article{--tint:var(--accent);--tint-soft:var(--accent-soft)}
.col--note{--tint:#6f7d5a;--tint-soft:#eef0e6}
.col--photo{--tint:#4a6b8a;--tint-soft:#e6edf3}
[data-theme="dark"] .col--note{--tint:#9fb383;--tint-soft:#232a1e}
[data-theme="dark"] .col--photo{--tint:#8fb0cc;--tint-soft:#1c242b}

.col-num{
  position:absolute;
  top:24px;
  right:26px;
  font-size:12px;
  letter-spacing:.16em;
  color:var(--text-muted);
  opacity:.55;
  font-variant-numeric:tabular-nums;
}

.col-glyph{
  position:relative;
  font-family:var(--serif);
  font-size:32px;
  font-weight:600;
  line-height:1;
  color:var(--tint);
  margin-bottom:20px;
}

.col-title{
  position:relative;
  font-family:var(--serif);
  font-size:22px;
  font-weight:600;
  line-height:1.4;
  margin:0 0 8px;
}

.col-desc{
  position:relative;
  margin:0 0 24px;
  font-size:14.5px;
  line-height:1.78;
  color:var(--text-muted);
  flex:1 1 auto;
}

.col-foot{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding-top:14px;
  border-top:1px solid var(--border);
  font-size:13px;
  color:var(--text-muted);
}
.col-arrow{
  color:var(--tint);
  font-size:16px;
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.col:hover .col-arrow{transform:translateX(5px)}

/* ============ 页脚 ============ */
.site-footer{
  max-width:var(--maxw);
  margin:0 auto;
  padding:36px 24px 70px;
  border-top:1px solid var(--border);
  text-align:center;
  color:var(--text-muted);
  font-size:13px;
}
.site-footer p{margin:0}
.site-footer a{
  color:inherit;
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:color .2s,border-color .2s;
}
.site-footer a:hover{
  color:var(--accent);
  border-bottom-color:var(--accent);
}
.site-footer .foot-mail{
  -webkit-user-select:text;
  user-select:text;
}

/* ============ 响应式 ============ */
@media (max-width:720px){
  .site-header{padding:34px 20px 28px}
  .topbar{margin-bottom:22px}
  .profile{gap:18px;align-items:flex-start}
  .avatar{width:70px;height:70px}
  .theme-toggle{width:36px;height:36px}

  .status-bar{padding:0 20px;margin-bottom:24px}
  .status-inner{gap:16px;padding:14px 18px}
  .status-sep{display:none}
  .status-group{flex:1 1 auto}
  .status-text strong{font-size:15px}

  .columns{padding:0 20px 72px;gap:18px}
  .col{min-height:0;padding:26px 22px 20px}
  .col-glyph{font-size:28px;margin-bottom:16px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. 主题切换
     ========================================================= */
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');

  toggle.addEventListener('click', function () {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  /* =========================================================
     2. 实时时钟
     ========================================================= */
  const clockTimeEl = document.getElementById('clockTime');
  const clockDateEl = document.getElementById('clockDate');
  const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateClock() {
    const now = new Date();
    clockTimeEl.textContent =
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

    clockDateEl.textContent =
      now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日' +
      ' · 星期' + WEEKDAYS[now.getDay()];
  }

  updateClock();
  setInterval(updateClock, 1000);

  /* =========================================================
     3. 天气模块（Open-Meteo · 免费无需 API Key）
        ▸ 想固定显示某个城市，直接改 DEFAULT_LOCATION 即可。
          北京 39.9042,116.4074   上海 31.2304,121.4737
          杭州 30.2741,120.1551   深圳 22.5431,114.0579
     ========================================================= */
  const DEFAULT_LOCATION = { lat: 30.2741, lon: 120.1551, name: '杭州' };

  const weatherIconEl = document.getElementById('weatherIcon');
  const weatherMainEl = document.getElementById('weatherMain');
  const weatherSubEl  = document.getElementById('weatherSub');

  const WMO = {
    0:{t:'晴',i:'☀️'}, 1:{t:'晴间多云',i:'🌤️'}, 2:{t:'多云',i:'⛅'}, 3:{t:'阴',i:'☁️'},
    45:{t:'雾',i:'🌫️'}, 48:{t:'雾凇',i:'🌫️'},
    51:{t:'小毛毛雨',i:'🌦️'}, 53:{t:'毛毛雨',i:'🌦️'}, 55:{t:'大毛毛雨',i:'🌧️'},
    56:{t:'冻毛毛雨',i:'🌨️'}, 57:{t:'冻毛毛雨',i:'🌨️'},
    61:{t:'小雨',i:'🌦️'}, 63:{t:'中雨',i:'🌧️'}, 65:{t:'大雨',i:'🌧️'},
    66:{t:'冻雨',i:'🌨️'}, 67:{t:'冻雨',i:'🌨️'},
    71:{t:'小雪',i:'🌨️'}, 73:{t:'中雪',i:'🌨️'}, 75:{t:'大雪',i:'❄️'}, 77:{t:'雪粒',i:'❄️'},
    80:{t:'小阵雨',i:'🌦️'}, 81:{t:'阵雨',i:'🌧️'}, 82:{t:'强阵雨',i:'⛈️'},
    85:{t:'小阵雪',i:'🌨️'}, 86:{t:'大阵雪',i:'❄️'},
    95:{t:'雷阵雨',i:'⛈️'}, 96:{t:'雷阵雨伴冰雹',i:'⛈️'}, 99:{t:'雷暴伴冰雹',i:'⛈️'}
  };

  function renderWeather(data, placeName) {
    const cur = data.current;
    const info = WMO[cur.weather_code] || { t: '未知', i: '❔' };

    weatherIconEl.textContent = info.i;
    weatherMainEl.textContent = Math.round(cur.temperature_2m) + '°C ' + info.t;
    weatherSubEl.textContent =
      placeName + ' · 体感 ' + Math.round(cur.apparent_temperature) + '°C · 湿度 ' + cur.relative_humidity_2m + '%';
  }

  function renderWeatherError(msg) {
    weatherIconEl.textContent = '⚠️';
    weatherMainEl.textContent = '天气不可用';
    weatherSubEl.textContent = msg || '稍后重试';
  }

  function fetchWeather(lat, lon, placeName) {
    const url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + lat
      + '&longitude=' + lon
      + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code'
      + '&timezone=auto';

    return fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) { renderWeather(data, placeName); })
      .catch(function () { renderWeatherError('网络异常，请稍后刷新'); });
  }

  function initWeather() {
    if (navigator.geolocation) {
      let settled = false;

      const fallbackTimer = setTimeout(function () {
        if (!settled) {
          settled = true;
          fetchWeather(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name);
        }
      }, 4000);

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          if (settled) return;
          settled = true;
          clearTimeout(fallbackTimer);
          fetchWeather(pos.coords.latitude, pos.coords.longitude, '当前位置');
        },
        function () {
          if (settled) return;
          settled = true;
          clearTimeout(fallbackTimer);
          fetchWeather(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name);
        },
        { timeout: 3500, maximumAge: 600000 }
      );
    } else {
      fetchWeather(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name);
    }
  }

  initWeather();
  setInterval(initWeather, 10 * 60 * 1000);

  /* =========================================================
     4. 入场动画
     ========================================================= */
  document.querySelectorAll('.col').forEach(function (el, i) {
    el.style.animationDelay = Math.min(i, 9) * 60 + 'ms';
    el.classList.add('enter');
  });

  /* =========================================================
     5. 页脚年份自动更新
     ========================================================= */
  document.getElementById('year').textContent = new Date().getFullYear();

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文章 · 言一</title>

<script>
(function(){
  try{
    var t = localStorage.getItem('theme');
    if(!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if(t) document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ 设计变量 ============ */
*,*::before,*::after{box-sizing:border-box}

:root{
  --bg:#f7f5f1;
  --surface:#ffffff;
  --surface-2:#f0ede7;
  --text:#1a1917;
  --text-muted:#7a756d;
  --border:#e8e4dc;
  --accent:#c9552f;
  --accent-soft:#f8e9e3;
  --radius:18px;
  --shadow:0 1px 2px rgba(28,27,25,.03),0 4px 16px -8px rgba(28,27,25,.10);
  --shadow-hover:0 2px 6px rgba(28,27,25,.05),0 22px 44px -22px rgba(28,27,25,.28);
  --maxw:1100px;
  --serif:"Noto Serif SC",Georgia,"Songti SC","STSong",serif;
}

[data-theme="dark"]{
  --bg:#131215;
  --surface:#1c1b1f;
  --surface-2:#26242a;
  --text:#ece9e3;
  --text-muted:#948f88;
  --border:#2b2930;
  --accent:#e5794f;
  --accent-soft:#33231c;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-hover:0 26px 52px -26px rgba(0,0,0,.9);
}

/* ============ 基础 ============ */
html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(900px 480px at 12% -8%, rgba(201,85,47,.09), transparent 62%),
    radial-gradient(700px 420px at 92% 4%, rgba(90,130,180,.07), transparent 60%);
  pointer-events:none;
  z-index:0;
}
[data-theme="dark"] body::before{
  background:
    radial-gradient(900px 480px at 12% -8%, rgba(229,121,79,.12), transparent 62%),
    radial-gradient(700px 420px at 92% 4%, rgba(90,130,180,.10), transparent 60%);
}

.page{position:relative;z-index:1}

img{display:block;max-width:100%}

/* ============ 入场动画 ============ */
@keyframes riseIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
.enter{animation:riseIn .55s cubic-bezier(.2,.8,.2,1) backwards}

/* ============ 顶部栏 ============ */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:30px;
}

.site-nav{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
}
.site-nav a{
  font-size:13px;
  color:var(--text-muted);
  text-decoration:none;
  padding:5px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  transition:color .2s,border-color .2s,transform .2s;
}
.site-nav a:hover{
  color:var(--accent);
  border-color:var(--accent);
  transform:translateY(-1px);
}
.site-nav a.is-active{
  color:var(--bg);
  background:var(--text);
  border-color:var(--text);
}

/* ============ 页头 ============ */
.site-header{
  max-width:var(--maxw);
  margin:0 auto;
  padding:44px 24px 32px;
}

.page-title{
  font-family:var(--serif);
  font-size:clamp(26px,5vw,36px);
  font-weight:700;
  letter-spacing:-.01em;
  margin:0 0 6px;
  line-height:1.25;
}

.page-sub{
  margin:0;
  color:var(--text-muted);
  font-size:15px;
  max-width:46ch;
  line-height:1.75;
}

/* 主题切换 */
.theme-toggle{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:color .25s,border-color .25s,transform .25s,background .25s;
}
.theme-toggle:hover{
  color:var(--accent);
  border-color:var(--accent);
  transform:rotate(18deg);
}
.theme-toggle svg{width:18px;height:18px}
.theme-toggle .icon-moon{display:none}
[data-theme="dark"] .theme-toggle .icon-sun{display:none}
[data-theme="dark"] .theme-toggle .icon-moon{display:block}

/* ============ 文章列表 ============ */
.posts{
  max-width:var(--maxw);
  margin:0 auto;
  padding:0 24px 90px;
  display:flex;
  flex-direction:column;
  gap:22px;
}

.post{
  display:grid;
  grid-template-columns:300px 1fr;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  text-decoration:none;
  color:inherit;
  transition:transform .4s cubic-bezier(.2,.8,.2,1),
             box-shadow .4s cubic-bezier(.2,.8,.2,1),
             border-color .3s;
}
.post:hover{
  transform:translateY(-4px);
  border-color:transparent;
  box-shadow:var(--shadow-hover);
}

.post-cover{
  display:block;
  min-height:210px;
  background:linear-gradient(120deg,var(--surface-2),var(--border));
  overflow:hidden;
}
.post-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .7s cubic-bezier(.2,.8,.2,1);
}
.post:hover .post-cover img{transform:scale(1.045)}

.post-body{
  display:flex;
  flex-direction:column;
  padding:24px 26px 22px;
}

.meta{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12.5px;
  color:var(--text-muted);
  letter-spacing:.01em;
  flex-wrap:wrap;
}
.meta .dot{opacity:.5}

.tag{
  color:var(--accent);
  background:var(--accent-soft);
  font-weight:600;
  padding:2px 10px;
  border-radius:999px;
  font-size:12px;
}

.post-title{
  font-family:var(--serif);
  font-size:21px;
  font-weight:600;
  line-height:1.5;
  letter-spacing:-.005em;
  margin:13px 0 9px;
}

.post-excerpt{
  margin:0 0 18px;
  font-size:14.5px;
  line-height:1.78;
  color:var(--text-muted);
  flex:1 1 auto;
}

.post-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-top:14px;
  border-top:1px solid var(--border);
  font-size:13px;
  color:var(--text-muted);
}
.post-foot .arrow{
  font-size:15px;
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.post:hover .arrow{transform:translateX(5px)}

/* ============ 页脚 ============ */
.site-footer{
  max-width:var(--maxw);
  margin:0 auto;
  padding:36px 24px 70px;
  border-top:1px solid var(--border);
  text-align:center;
  color:var(--text-muted);
  font-size:13px;
}
.site-footer p{margin:0}
.site-footer a{
  color:inherit;
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:color .2s,border-color .2s;
}
.site-footer a:hover{
  color:var(--accent);
  border-bottom-color:var(--accent);
}

/* ============ 响应式 ============ */
@media (max-width:720px){
  .site-header{padding:34px 20px 26px}
  .topbar{margin-bottom:22px}
  .theme-toggle{width:36px;height:36px}
  .posts{padding:0 20px 72px;gap:18px}
  .post{grid-template-columns:1fr}
  .post-cover{min-height:0;aspect-ratio:16/9}
  .post-body{padding:20px 20px 18px}
  .post-title{font-size:19.5px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

<body>

<div class="page">

  <header class="site-header">

    <div class="topbar">
      <nav class="site-nav">
        <a href="index.html">首页</a>
        <a href="articles.html" class="is-active">文章</a>
        <a href="notes.html">随笔</a>
        <a href="gallery.html">相片馆</a>
      </nav>

      <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/>
        </svg>
      </button>
    </div>

    <h1 class="page-title">文章</h1>
    <p class="page-sub">长一点的思考。最新的排在最前面。</p>
  </header>

  <!-- ============ 文章列表 ============
       加新文章：复制一个 <a class="post"> 整块，改
       href / 封面图 / 标签 / 日期 / 标题 / 摘要 / 阅读时长。
       href 换成你自己的文章页地址，例如 posts/whitespace.html
  ====================================== -->
  <main class="posts" id="posts">

    <!-- 1 -->
    <a class="post" href="#">
      <span class="post-cover">
        <img src="https://picsum.photos/seed/whitespace11/1000/560" alt="" loading="lazy">
      </span>
      <span class="post-body">
        <span class="meta">
          <span class="tag">设计</span>
          <span class="dot">·</span>
          <time datetime="2024-11-12">2024 年 11 月 12 日</time>
        </span>
        <h2 class="post-title">留白不是空的：说说设计里最容易被忽略的呼吸感</h2>
        <p class="post-excerpt">
          当我把页面上三分之一的元素删掉之后，信息的清晰度反而提升了。留白从来不是「还没填满」，
          它本身就是内容的一部分。
        </p>
        <span class="post-foot">
          <span>8 分钟阅读</span>
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </span>
    </a>

    <!-- 2 -->
    <a class="post" href="#">
      <span class="post-cover">
        <img src="https://picsum.photos/seed/writing55/1000/560" alt="" loading="lazy">
      </span>
      <span class="post-body">
        <span class="meta">
          <span class="tag">随笔式技术</span>
          <span class="dot">·</span>
          <time datetime="2024-10-28">2024 年 10 月 28 日</time>
        </span>
        <h2 class="post-title">我为什么重新开始写博客</h2>
        <p class="post-excerpt">
          写给别人看的时候，我会不自觉地表演。写给自己看的时候，我才敢承认很多事我其实没想明白——
          而这恰恰是写作最有用的部分。
        </p>
        <span class="post-foot">
          <span>6 分钟阅读</span>
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </span>
    </a>

  </main>

  <footer class="site-footer">
    <p>© <span id="year">2024</span> 言一 · <a href="index.html">回到首页</a></p>
  </footer>

</div>

<script>
(function () {
  'use strict';

  /* 1. 主题切换（与其它页面共用 key = 'theme'） */
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');

  toggle.addEventListener('click', function () {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  /* 2. 入场动画 */
  document.querySelectorAll('.post').forEach(function (el, i) {
    el.style.animationDelay = Math.min(i, 9) * 45 + 'ms';
    el.classList.add('enter');
  });

  /* 3. 图片加载失败兜底 */
  document.querySelectorAll('.post-cover img').forEach(function (img) {
    img.addEventListener('error', function () { img.style.display = 'none'; });
  });

  /* 4. 页脚年份 */
  document.getElementById('year').textContent = new Date().getFullYear();

})();
</script>

</body>
</html>

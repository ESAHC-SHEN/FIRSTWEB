<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>日历 · 言一</title>

<script>
(function(){
  document.documentElement.classList.add('js');
  try{
    var t = localStorage.getItem('theme');
    if(!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if(t) document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* =========================================================
   日历页
   三级视图（日 / 月 / 年）+ 虚拟化月历 + 日期详情浮层
   ========================================================= */
.cal-page{
  position:relative;
  max-width:880px;
  margin:0 auto;
  padding:0 14px;
  height:calc(100dvh - var(--nav-h) - var(--tabbar-h));
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
@supports not (height:100dvh){
  .cal-page{height:calc(100vh - var(--nav-h) - var(--tabbar-h))}
}

/* ---------- 顶部工具条 ---------- */
.cal-bar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 4px 10px;
}
.cal-title{
  font-family:var(--serif);
  font-size:clamp(17px,3.4vw,21px);
  font-weight:600;
  letter-spacing:-.01em;
  padding:6px 12px;
  border:0;
  border-radius:var(--r-full);
  background:none;
  color:var(--text);
  cursor:pointer;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),transform var(--t-fast) var(--spring);
}
@media (hover:hover){.cal-title:hover{background:color-mix(in srgb, var(--accent) 13%, transparent);color:var(--accent)}}
.cal-title:active{transform:scale(.96)}

.cal-hint{
  font-size:12px;
  color:var(--text-3);
  white-space:nowrap;
}

/* ---------- 视图容器 ---------- */
.cal-views{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}
.cal-level{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}
/* 关键修正：hidden 必须真的隐藏，否则三级视图会同时堆在页面上 */
.cal-level[hidden]{display:none !important}
.cal-level.anim-in{animation:levelIn .46s var(--ease) both}
@keyframes levelIn{
  from{opacity:0;transform:translate3d(0,10px,0) scale(.985)}
  to{opacity:1;transform:none}
}

/* ---------- 星期表头 ---------- */
.cal-weekdays{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
  padding:6px 10px 8px;
  margin:0 4px;
  border-bottom:1px solid var(--line);
}
.cal-weekdays span{
  text-align:center;
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.06em;
  color:var(--text-3);
}
.cal-weekdays span:first-child,
.cal-weekdays span:last-child{color:color-mix(in srgb, var(--accent) 70%, var(--text-3))}

/* ---------- 日视图 ---------- */
.cal-scroller{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  overscroll-behavior:contain;
  cursor:grab;
  outline:none;
  -webkit-overflow-scrolling:touch;
}
.cal-scroller.is-dragging{cursor:grabbing}
.cal-scroller.is-dragging .cal-cell{pointer-events:none}

.cal-panel{
  height:100%;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(6,minmax(0,1fr));
  gap:2px;
  padding:8px 10px 12px;
}

.cal-cell{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  min-width:0;
  min-height:0;
  overflow:hidden;
  border-radius:16px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background var(--t-fast) var(--ease), transform var(--t-fast) var(--spring);
}
.cal-cell b{
  display:grid;
  place-items:center;
  flex:0 0 auto;
  width:clamp(26px,3.5vh,36px);
  height:clamp(26px,3.5vh,36px);
  border-radius:50%;
  font-size:clamp(13.5px,1.75vh,15.5px);
  font-weight:500;
  line-height:1;
  font-variant-numeric:tabular-nums;
  color:var(--text);
  transition:background var(--t) var(--ease), color var(--t) var(--ease),
             box-shadow var(--t) var(--ease), transform var(--t-fast) var(--spring);
}
.cal-cell i{
  font-size:10px;
  font-style:normal;
  line-height:1.1;
  color:var(--text-3);
  max-width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-cell.is-out{opacity:0;pointer-events:none}
.cal-cell.is-weekend b{color:var(--accent)}
.cal-cell.is-term i{color:color-mix(in srgb, var(--accent-2) 85%, #000)}
[data-theme="dark"] .cal-cell.is-term i{color:var(--accent-2)}
.cal-cell.is-fest i{color:var(--festival);font-weight:600}
.cal-cell.is-work i{color:var(--orange);font-weight:600}
@media (hover:hover){
  .cal-cell:not(.is-out):hover{background:var(--fill)}
  .cal-cell:not(.is-out):hover b{transform:scale(1.06)}
}
.cal-cell.is-today b{
  background:var(--accent);
  color:#fff;
  font-weight:600;
  box-shadow:0 6px 16px -6px color-mix(in srgb, var(--accent) 80%, transparent);
}
.cal-cell.is-today i{color:color-mix(in srgb, var(--accent) 80%, var(--text-2))}
.cal-cell.is-selected{background:color-mix(in srgb, var(--accent) 12%, transparent)}
.cal-cell.is-selected b{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-cell.is-selected.is-today b{box-shadow:inset 0 0 0 2px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent)}
.cal-cell.pop b{animation:popIn .46s var(--spring-soft) backwards}

/* ---------- 月视图 ---------- */
.cal-months{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:14px 10px 30px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(184px,1fr));
  gap:12px;
  align-content:start;
}
.month-cell{
  display:flex;
  flex-direction:column;
  gap:9px;
  padding:13px 13px 15px;
  border:1px solid var(--line);
  border-radius:var(--r-l);
  background:var(--glass-thin);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--sheen);
  font-family:inherit;
  color:var(--text);
  cursor:pointer;
  text-align:left;
  -webkit-tap-highlight-color:transparent;
  transition:transform var(--t) var(--spring-soft), border-color var(--t-fast), background var(--t-fast), box-shadow var(--t);
  animation:popIn .44s var(--spring-soft) backwards;
  animation-delay:calc(var(--i,0) * 24ms);
}
@media (hover:hover){
  .month-cell:hover{transform:translateY(-3px) scale(1.012);border-color:color-mix(in srgb, var(--accent) 40%, transparent);box-shadow:var(--sh-2), inset 0 1px 0 var(--sheen)}
}
.month-cell:active{transform:scale(.975)}
.month-cell.is-on{
  border-color:var(--accent);
  background:color-mix(in srgb, var(--accent) 11%, var(--glass-thin));
  box-shadow:0 0 0 1px var(--accent), var(--sh-1), inset 0 1px 0 var(--sheen);
}
.month-cell-t{font-size:13.5px;font-weight:600;letter-spacing:-.01em}

.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini-d{
  font-size:9.5px;
  text-align:center;
  line-height:1.65;
  border-radius:5px;
  color:var(--text-3);
  font-variant-numeric:tabular-nums;
}
.mini-d.is-out{opacity:0}
.mini-d.is-fest{color:var(--festival);font-weight:600}
.mini-d.is-term{color:color-mix(in srgb, var(--accent-2) 85%, #000)}
[data-theme="dark"] .mini-d.is-term{color:var(--accent-2)}
.mini-d.is-today{background:var(--accent);color:#fff;font-weight:600}
.mini-d.is-selected{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600}

/* ---------- 年视图 ---------- */
.cal-years{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:14px 10px 30px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:9px;
  align-content:start;
}
.year-cell{
  padding:12px 4px;
  border:1px solid var(--line);
  border-radius:var(--r-m);
  background:var(--glass-thin);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--sheen);
  font-family:inherit;
  font-size:14px;
  color:var(--text);
  cursor:pointer;
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
  transition:transform var(--t) var(--spring-soft), border-color var(--t-fast), background var(--t-fast), color var(--t-fast);
}
@media (hover:hover){
  .year-cell:hover{transform:translateY(-2px);border-color:color-mix(in srgb, var(--accent) 45%, transparent);color:var(--accent)}
}
.year-cell:active{transform:scale(.95)}
.year-cell.is-on{
  background:var(--accent);
  border-color:transparent;
  color:#fff;
  font-weight:600;
  box-shadow:0 8px 20px -8px color-mix(in srgb, var(--accent) 75%, transparent), inset 0 1px 0 rgba(255,255,255,.4);
}

/* ---------- 选中日期详情（浮层，不挤压日历高度） ---------- */
.cal-detail{
  position:absolute;
  left:18px;right:18px;bottom:16px;
  z-index:30;
  padding:15px 18px 16px;
  border-radius:var(--r-xl);
  background:var(--glass-strong);
  -webkit-backdrop-filter:var(--blur-strong);
  backdrop-filter:var(--blur-strong);
  border:1px solid var(--line);
  box-shadow:var(--sh-3), inset 0 1px 0 var(--sheen);
  opacity:0;
  transform:translate3d(0,calc(100% + 26px),0) scale(.97);
  transition:transform .54s var(--spring), opacity .26s var(--ease);
  pointer-events:none;
  will-change:transform;
}
.cal-detail.is-open{opacity:1;transform:none;pointer-events:auto}

.cd-top{display:flex;align-items:center;gap:13px}
.cd-daynum{
  flex:0 0 auto;
  display:grid;place-items:center;
  width:52px;height:52px;
  border-radius:17px;
  background:linear-gradient(150deg,var(--accent),var(--purple));
  color:#fff;
  font-size:23px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  box-shadow:0 10px 24px -10px color-mix(in srgb, var(--accent) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.45);
}
.cd-titles{min-width:0;flex:1 1 auto}
.cd-titles strong{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.cd-titles span{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px}
.cd-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.cd-actions .icon-btn{width:32px;height:32px;background:var(--fill)}
.cd-actions .icon-btn svg{width:16px;height:16px}

.cd-chips{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0 0;min-height:24px}
.cd-facts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:13px;
  padding-top:13px;
  border-top:1px solid var(--line);
}
.cd-fact{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
.cd-fact b{
  font-size:13.5px;
  font-weight:600;
  letter-spacing:-.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cd-fact span{font-size:11px;color:var(--text-3)}

/* ---------- 响应式 ---------- */
@media (max-width:720px){
  .cal-page{padding:0 8px}
  .cal-bar{padding:10px 2px 8px;gap:7px}
  .cal-hint{display:none}
  .cal-weekdays{padding:4px 6px 6px;margin:0 2px}
  .cal-panel{padding:6px 6px 10px;gap:1px}
  .cal-cell{border-radius:13px}
  .cal-cell i{font-size:9px}
  .cal-months{padding:12px 6px 26px;grid-template-columns:1fr 1fr;gap:9px}
  .month-cell{padding:11px 10px 12px;gap:7px}
  .cal-years{grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:7px;padding:12px 6px 26px}
  .cal-detail{left:10px;right:10px;bottom:10px;padding:13px 14px 14px;border-radius:24px}
  .cd-facts{grid-template-columns:repeat(2,1fr);gap:9px}
  .cd-daynum{width:46px;height:46px;font-size:20px;border-radius:15px}
}
@media (max-height:560px){
  .cal-cell i{display:none}
}
/* 窄屏：工具条不能挤到换行，控件一起收一点 */
@media (max-width:540px){
  .cal-bar{gap:5px;padding:9px 0 7px}
  .cal-title{font-size:16px;padding:5px 8px}
  .seg-item{padding:0 10px;font-size:13px;height:28px}
  .segmented{padding:2px}
  .seg-thumb{top:2px;bottom:2px}
  .cal-page{padding:0 6px}
}
</style>
</head>

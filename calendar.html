<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日历 · 言一</title>

<script>
(function(){
  try{
    var t = localStorage.getItem('theme');
    if(!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if(t) document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">

<style>
/* =========================================================
   日历页
   ========================================================= */
.cal-page{
  max-width:840px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  height:calc(100vh - var(--nav-h));
}
@supports (height:100dvh){
  .cal-page{height:calc(100dvh - var(--nav-h))}
}

.cal-bar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 20px 10px;
}
.cal-title{
  font-family:var(--serif);
  font-size:clamp(18px,3.6vw,22px);
  font-weight:600;
  padding:5px 12px;
  border:0;
  border-radius:10px;
  background:none;
  color:var(--text);
  cursor:pointer;
  transition:background .22s,color .22s;
  white-space:nowrap;
}
.cal-title:hover{background:var(--accent-soft);color:var(--accent)}

.cal-hint{
  font-size:12px;
  color:var(--text-muted);
  opacity:.7;
  white-space:nowrap;
}

.cal-views{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}
.cal-level{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}

/* ---- 星期表头 ---- */
.cal-weekdays{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  padding:10px 18px 6px;
}
.cal-weekdays span{
  text-align:center;
  font-size:11.5px;
  letter-spacing:.08em;
  color:var(--text-muted);
}

/* ---- 日视图 ---- */
.cal-scroller{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  overscroll-behavior:contain;
  cursor:grab;
}
.cal-scroller.is-dragging{cursor:grabbing;user-select:none}

.cal-panel{
  height:100%;
  scroll-snap-align:start;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(6,1fr);
  gap:4px;
  padding:0 18px 14px;
}

.cal-cell{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  min-width:0;
  border-radius:9px;
  transition:background .2s;
}
.cal-cell b{
  font-size:14.5px;
  font-weight:500;
  line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.cal-cell i{
  font-size:10px;
  font-style:normal;
  line-height:1.15;
  color:var(--text-muted);
  max-width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-cell.is-out{opacity:0}
.cal-cell.is-weekend b{color:var(--accent)}
.cal-cell.is-term i{color:var(--accent-2)}
.cal-cell.is-fest i{color:var(--festival);font-weight:600}
.cal-cell:not(.is-today):not(.is-out):hover{background:var(--surface-2)}
.cal-cell.is-today{background:var(--accent)}
.cal-cell.is-today b{color:#fff;font-weight:600}
.cal-cell.is-today i{color:rgba(255,255,255,.88)}

/* ---- 月视图 ---- */
.cal-months{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:16px 20px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
  align-content:start;
}
.month-cell{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:12px 12px 14px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--surface);
  font-family:inherit;
  color:var(--text);
  cursor:pointer;
  text-align:left;
  transition:border-color .25s,transform .25s,box-shadow .25s;
}
.month-cell:hover{
  border-color:var(--accent);
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}
.month-cell.is-on{border-color:var(--accent);background:var(--accent-soft)}
.month-cell-t{font-size:13.5px;font-weight:600}

.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini-d{
  font-size:9.5px;
  text-align:center;
  line-height:1.6;
  border-radius:4px;
  color:var(--text-muted);
  font-variant-numeric:tabular-nums;
}
.mini-d.is-out{opacity:0}
.mini-d.is-fest{color:var(--festival);font-weight:600}
.mini-d.is-term{color:var(--accent-2)}
.mini-d.is-today{background:var(--accent);color:#fff;font-weight:600}

/* ---- 年视图 ---- */
.cal-years{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:16px 20px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:10px;
  align-content:start;
}
.year-cell{
  padding:11px 6px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--surface);
  font-family:inherit;
  font-size:14px;
  color:var(--text);
  cursor:pointer;
  font-variant-numeric:tabular-nums;
  transition:border-color .22s,color .22s,background .22s,transform .22s;
}
.year-cell:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.year-cell.is-on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

@media (max-width:720px){
  .cal-bar{padding:12px 16px 8px;gap:6px}
  .cal-hint{display:none}
  .cal-weekdays{padding:8px 12px 5px;gap:3px}
  .cal-panel{padding:0 12px 10px;gap:3px}
  .cal-cell b{font-size:13.5px}
  .cal-cell i{font-size:9px}
  .cal-months{padding:14px;grid-template-columns:1fr 1fr;gap:10px}
  .cal-years{padding:14px;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
}
</style>
</head>

<body>

<header class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="index.html">
      <span class="brand-cn">言一</span>
      <span class="brand-py">Yán Yī</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-match="index.html calendar.html weather.html">首页</a>
      <a href="articles.html" data-match="articles.html">文章</a>
      <a href="notes.html" data-match="notes.html">随笔</a>
      <a href="gallery.html" data-match="gallery.html">相片馆</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/>
      </svg>
    </button>
  </div>
</header>

<div class="cal-page">

  <div class="cal-bar">
    <button class="cal-title" id="calTitle">加载中…</button>
    <span class="cal-hint">点标题放大到月 / 年</span>
    <button class="ghost-btn push-right" id="calToday">回到今天</button>
  </div>

  <div class="cal-views">

    <!-- 日视图 -->
    <div class="cal-level" id="calLevelDay">
      <div class="cal-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span>
        <span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-scroller" id="calScroller"></div>
    </div>

    <!-- 月视图 -->
    <div class="cal-level" id="calLevelMonth" hidden>
      <div class="cal-months" id="calMonths"></div>
    </div>

    <!-- 年视图 -->
    <div class="cal-level" id="calLevelYear" hidden>
      <div class="cal-years" id="calYears"></div>
    </div>

  </div>
</div>

<script src="assets/app.js" defer></script>
<script src="assets/calendar.js" defer></script>

</body>
</html>
